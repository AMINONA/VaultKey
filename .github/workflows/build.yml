name: Build EXE

on:
  workflow_dispatch:
    inputs:
        create_release:
          description: "Créer une release après le build"
          type: boolean
          default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Compiler l'application
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --name VaultKey --add-data "index.html;." --collect-all cryptography --collect-all requests --collect-all webview projet.py

      - name: Sauvegarder le build
        uses: actions/upload-artifact@v4
        with:
          name: VaultKey
          path: dist/*
      - name: Déclencher Release
        if: inputs.create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release.yml",
              ref: context.ref.replace("refs/heads/", "")
            })