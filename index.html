<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultKey — Gestionnaire de mots de passe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d0d0f;
            --bg-card: #141417;
            --bg-card2: #1a1a1f;
            --bg-input: #1e1e24;
            --accent: #e8ff47;
            --accent2: #47ffe8;
            --danger: #ff5c5c;
            --text: #f0ede8;
            --text-muted: #8a8882;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.13);
            --font-title: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(13,13,15,0.92);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-right: 16px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d0d0f;
            font-size: 16px;
        }

        .logo-text {
            font-family: var(--font-title);
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .search-wrap {
            flex: 1;
            position: relative;
            max-width: 900px;
            min-width: 150px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px 10px 40px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: rgba(232,255,71,0.3); }

        .topbar-actions { display: flex; gap: 10px; margin-left: auto; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.04); }

        .btn-accent {
            background: var(--accent);
            color: #0d0d0f;
            font-weight: 600;
        }

        .btn-accent:hover { opacity: 0.9; transform: translateY(-1px); }

        /* CONTENT */
        .content { padding: 32px 40px; }

        .content-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .content-title {
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .content-count { font-size: 13px; color: var(--text-muted); }

        /* STATS */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .stat-icon.total   { background: rgba(232,255,71,0.1);  color: var(--accent); }
        .stat-icon.strong  { background: rgba(71,255,138,0.1);  color: #47ff8a; }
        .stat-icon.medium  { background: rgba(255,170,71,0.1);  color: #ffaa47; }
        .stat-icon.weak    { background: rgba(255,92,92,0.1);   color: var(--danger); }

        .stat-info { display: flex; flex-direction: column; gap: 2px; }
        .stat-label { font-size: 12px; color: var(--text-muted); }

        .stat-value {
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-value.green  { color: #47ff8a; }
        .stat-value.orange { color: #ffaa47; }
        .stat-value.red    { color: var(--danger); }

        /* FILTER TABS */
        .filter-tabs { display: flex; gap: 6px; margin-bottom: 20px; }

        .filter-tab {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-body);
            transition: all 0.15s;
        }

        .filter-tab:hover { border-color: var(--border-hover); color: var(--text); }

        .filter-tab.active {
            background: rgba(232,255,71,0.08);
            border-color: rgba(232,255,71,0.25);
            color: var(--accent);
        }

        .filter-tab i { font-size: 12px; }

        /* PASSWORD LIST */
        .pwd-list { display: flex; flex-direction: column; gap: 10px; }

        .pwd-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 44px 1fr auto;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .pwd-card:hover { border-color: var(--border-hover); transform: translateX(3px); }
        .pwd-card.weak   { border-left-color: var(--danger); }
        .pwd-card.medium { border-left-color: #ffaa47; }
        .pwd-card.strong { border-left-color: #47ff8a; }

        .site-avatar {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--bg-card2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
            font-size: 17px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .pwd-info { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }

        .pwd-site {
            font-weight: 500;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pwd-user {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pwd-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

        .strength-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 100px;
        }

        .strength-badge i { font-size: 10px; }
        .strength-badge.weak   { background: rgba(255,92,92,0.12);  color: #ff5c5c; }
        .strength-badge.medium { background: rgba(255,170,71,0.12); color: #ffaa47; }
        .strength-badge.strong { background: rgba(71,255,138,0.12); color: #47ff8a; }

        .pwd-date { font-size: 11px; color: var(--text-muted); }

        .pwd-actions { display: flex; align-items: center; gap: 6px; }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); border-color: var(--border-hover); }
        .icon-btn.danger:hover { background: rgba(255,92,92,0.1); color: var(--danger); border-color: rgba(255,92,92,0.3); }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            padding: 32px;
            width: 480px;
            max-width: 95vw;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .modal-title {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }

        .modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input::placeholder { color: rgba(138,136,130,0.5); }
        .form-input:focus { border-color: rgba(232,255,71,0.35); }

        .pwd-input-wrap { position: relative; }
        .pwd-input-wrap .form-input { padding-right: 84px; font-family: monospace; letter-spacing: 1px; }

        .pwd-input-actions {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }

        .pwd-input-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.15s;
        }

        .pwd-input-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        /* STRENGTH DISPLAY — prêt à être lié au Python */
        .strength-display {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
        }

        .strength-bar-seg {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background: rgba(255,255,255,0.08);
            transition: background 0.3s;
        }

        /* Classes appliquées dynamiquement par Python via data-strength */
        .strength-bar-seg.filled-weak   { background: var(--danger); }
        .strength-bar-seg.filled-medium { background: #ffaa47; }
        .strength-bar-seg.filled-strong { background: #47ff8a; }

        .strength-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* data-strength sur la modale → affiche le bon état */
        .modal[data-strength="weak"]   .strength-text { color: #ff5c5c; }
        .modal[data-strength="medium"] .strength-text { color: #ffaa47; }
        .modal[data-strength="strong"] .strength-text { color: #47ff8a; }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 28px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--bg-card2);
            border: 1px solid rgba(71,255,232,0.2);
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--accent2);
            z-index: 200;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show { transform: translateY(0); opacity: 1; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        .empty-state i { font-size: 40px; margin-bottom: 16px; display: block; opacity: 0.3; }
        .empty-state p { font-size: 15px; }

        @media (max-width: 768px) {
            .topbar { padding: 16px 20px; }
            .content { padding: 24px 20px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .pwd-card { grid-template-columns: 44px 1fr; }
            .pwd-actions { display: none; }
        }
        @media (max-width: 500px) {
            span.logo-text { display: none; }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <a href="#" class="topbar-logo">
            <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
            <span class="logo-text">VaultKey</span>
        </a>

        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input
                class="search-input"
                type="text"
                id="search-input"
                placeholder="Rechercher un site, un identifiant…"
                oninput="handleSearch(this.value)"
            />
        </div>

        <div class="topbar-actions">
            <button class="btn btn-accent" onclick="openModal()">
                <i class="fa-solid fa-plus"></i>
                Nouveau mot de passe
            </button>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="content">

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-lock"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon strong"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Forts</span>
                    <span class="stat-value green" id="stat-strong">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon medium"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Moyens</span>
                    <span class="stat-value orange" id="stat-medium">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon weak"><i class="fa-solid fa-skull-crossbones"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Faibles</span>
                    <span class="stat-value red" id="stat-weak">0</span>
                </div>
            </div>
        </div>

        <!-- HEADER -->
        <div class="content-header">
            <h1 class="content-title">Mes mots de passe</h1>
            <span class="content-count" id="results-count">0 entrée</span>
        </div>

        <!-- FILTER TABS -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setTab(this,'all')">
                <i class="fa-solid fa-list"></i> Tous
            </button>
            <button class="filter-tab" onclick="setTab(this,'strong')">
                <i class="fa-solid fa-shield-halved"></i> Forts
            </button>
            <button class="filter-tab" onclick="setTab(this,'medium')">
                <i class="fa-solid fa-triangle-exclamation"></i> Moyens
            </button>
            <button class="filter-tab" onclick="setTab(this,'weak')">
                <i class="fa-solid fa-skull-crossbones"></i> Faibles
            </button>
        </div>

        <!-- PASSWORD LIST -->
        <div class="pwd-list" id="pwd-list"></div>

    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-box">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Nouveau mot de passe</h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Nom du site</label>
                <input class="form-input" id="f-site" type="text" placeholder="ex : GitHub, Netflix…" />
            </div>

            <div class="form-group">
                <label class="form-label">Identifiant / Email</label>
                <input class="form-input" id="f-user" type="text" placeholder="ex : dorien@email.com" />
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <div class="pwd-input-wrap">
                    <input class="form-input" id="f-pwd" type="password" placeholder="Entrez ou générez un mot de passe" />
                    <div class="pwd-input-actions">
                        <button class="pwd-input-btn" onclick="togglePwdVisibility()" title="Afficher / Masquer">
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </button>
                        <button class="pwd-input-btn" onclick="generatePassword()" title="Générer">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                    </div>
                </div>
                <!--
                    ZONE FORCE — à lier au Python.
                    Depuis Python, appelle setStrength('weak'|'medium'|'strong') après analyse.
                    Ou renseigne data-strength sur #modal-box directement.
                -->
                <div class="strength-display" id="strength-display">
                    <div class="strength-bar">
                        <div class="strength-bar-seg" id="seg1"></div>
                        <div class="strength-bar-seg" id="seg2"></div>
                        <div class="strength-bar-seg" id="seg3"></div>
                        <div class="strength-bar-seg" id="seg4"></div>
                    </div>
                    <span class="strength-text" id="strength-text">En attente d'analyse…</span>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
                <button class="btn btn-accent" onclick="savePassword()">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">Copié dans le presse-papiers</span>
    </div>

<script>
    /*
     * ─────────────────────────────────────────────
     *  DONNÉES — remplace ce tableau par un appel
     *  à ton API Python (fetch / requests)
     * ─────────────────────────────────────────────
     */
    let passwords = [
        { id: 1, site: 'GitHub',     user: 'dorien.drouet@esaip.fr',  pwd: 'Gh!t3r$2024xZ',   strength: 'strong', date: '12/05/2025' },
        { id: 2, site: 'Gmail',      user: 'dorien.drouet@gmail.com', pwd: 'pass1234',          strength: 'weak',   date: '03/01/2025' },
        { id: 3, site: 'LinkedIn',   user: 'dorien.drouet@esaip.fr',  pwd: 'Link3d!n#99Xp',    strength: 'strong', date: '20/04/2025' },
        { id: 4, site: 'Netflix',    user: 'dorien@gmail.com',         pwd: 'netflix2024',       strength: 'medium', date: '15/03/2025' },
        { id: 5, site: 'Instagram',  user: 'dorien_d',                 pwd: 'insta',             strength: 'weak',   date: '01/01/2025' },
        { id: 6, site: 'CIC Banque', user: '1234567890',               pwd: 'CiC!$ecur3#2025',  strength: 'strong', date: '10/05/2025' },
    ];

    let editId         = null;
    let currentStrength = 'all';
    let searchQuery    = '';

    /* ── FILTRAGE ── */
    function getFiltered() {
        return passwords.filter(p => {
            const matchStr    = currentStrength === 'all' || p.strength === currentStrength;
            const q           = searchQuery.toLowerCase();
            const matchSearch = !q || p.site.toLowerCase().includes(q) || p.user.toLowerCase().includes(q);
            return matchStr && matchSearch;
        });
    }

    /* ── RENDU LISTE ── */
    function renderList() {
        const list     = document.getElementById('pwd-list');
        const filtered = getFiltered();
        const n        = filtered.length;
        document.getElementById('results-count').textContent = n + ' entrée' + (n > 1 ? 's' : '');

        if (n === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <p>Aucun résultat trouvé</p>
                </div>`;
            updateStats();
            return;
        }

        const strengthLabel = { weak: 'Faible', medium: 'Moyen', strong: 'Fort' };
        const strengthIcon  = { weak: 'fa-skull-crossbones', medium: 'fa-triangle-exclamation', strong: 'fa-shield-halved' };

        list.innerHTML = filtered.map(p => `
            <div class="pwd-card ${p.strength}" id="card-${p.id}">
                <div class="site-avatar">${p.site[0].toUpperCase()}</div>
                <div class="pwd-info">
                    <span class="pwd-site">${p.site}</span>
                    <span class="pwd-user">${p.user}</span>
                    <div class="pwd-meta">
                        <span class="strength-badge ${p.strength}">
                            <i class="fa-solid ${strengthIcon[p.strength]}"></i>
                            ${strengthLabel[p.strength]}
                        </span>
                        <span class="pwd-date">
                            <i class="fa-regular fa-clock" style="margin-right:3px;"></i>${p.date}
                        </span>
                    </div>
                </div>
                <div class="pwd-actions">
                    <button class="icon-btn" onclick="copyPwd(${p.id})" title="Copier le mot de passe">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                    <button class="icon-btn" onclick="revealPwd(${p.id})" title="Afficher le mot de passe">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                    <button class="icon-btn" onclick="editPassword(${p.id})" title="Modifier">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                    <button class="icon-btn danger" onclick="deletePassword(${p.id})" title="Supprimer">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>
        `).join('');

        updateStats();
    }

    /* ── STATS ── */
    function updateStats() {
        document.getElementById('stat-total').textContent  = passwords.length;
        document.getElementById('stat-strong').textContent = passwords.filter(p => p.strength === 'strong').length;
        document.getElementById('stat-medium').textContent = passwords.filter(p => p.strength === 'medium').length;
        document.getElementById('stat-weak').textContent   = passwords.filter(p => p.strength === 'weak').length;
    }

    /* ── ACTIONS CARTE ── */
    function copyPwd(id) {
        const p = passwords.find(x => x.id === id);
        if (!p) return;
        navigator.clipboard.writeText(p.pwd).catch(() => {});
        showToast('Mot de passe copié pour ' + p.site);
    }

    function revealPwd(id) {
        const p = passwords.find(x => x.id === id);
        if (!p) return;
        showToast(p.pwd);
    }

    function deletePassword(id) {
        /*
         * TODO Python : envoyer une requête DELETE à ton API
         * ex : fetch('/api/passwords/' + id, { method: 'DELETE' })
         */
        passwords = passwords.filter(p => p.id !== id);
        renderList();
        showToast('Entrée supprimée');
    }

    function editPassword(id) {
        const p = passwords.find(x => x.id === id);
        if (!p) return;
        editId = id;
        document.getElementById('modal-title').textContent = 'Modifier — ' + p.site;
        document.getElementById('f-site').value = p.site;
        document.getElementById('f-user').value = p.user;
        document.getElementById('f-pwd').value  = p.pwd;
        setStrength(p.strength);
        openModal(true);
    }

    /* ── SAUVEGARDE ── */
    function savePassword() {
        const site = document.getElementById('f-site').value.trim();
        const user = document.getElementById('f-user').value.trim();
        const pwd  = document.getElementById('f-pwd').value.trim();
        if (!site || !user || !pwd) { showToast('Remplis tous les champs'); return; }

        const date = new Date().toLocaleDateString('fr-FR');

        /*
         * TODO Python : remplace la ligne suivante par un appel à ton API.
         * La force est calculée côté Python et renvoyée dans la réponse.
         * ex : const res = await fetch('/api/passwords', { method: 'POST', body: JSON.stringify({site,user,pwd}) })
         *      const { strength } = await res.json()
         * En attendant, on laisse 'medium' par défaut.
         */
        const strength = 'medium';

        if (editId) {
            passwords = passwords.map(p => p.id === editId ? { ...p, site, user, pwd, date, strength } : p);
            showToast('Modifié avec succès');
        } else {
            const newId = Math.max(...passwords.map(p => p.id), 0) + 1;
            passwords.push({ id: newId, site, user, pwd, strength, date });
            showToast('Mot de passe ajouté');
        }

        closeModal();
        renderList();
    }

    /*
     * ─────────────────────────────────────────────
     *  setStrength(level)
     *  Appelle cette fonction depuis Python/webview
     *  pour mettre à jour l'affichage de la force.
     *  level : 'weak' | 'medium' | 'strong' | ''
     * ─────────────────────────────────────────────
     */
    function setStrength(level) {
        const segs   = ['seg1','seg2','seg3','seg4'];
        const fill   = { weak: 1, medium: 2, strong: 4 };
        const labels = { weak: 'Faible', medium: 'Moyen', strong: 'Fort', '': 'En attente d\'analyse…' };
        const count  = fill[level] || 0;

        segs.forEach((id, i) => {
            document.getElementById(id).className =
                'strength-bar-seg' + (i < count ? ' filled-' + level : '');
        });

        document.getElementById('strength-text').textContent = labels[level] ?? 'En attente d\'analyse…';
        document.getElementById('modal-box').dataset.strength = level;
    }

    /* ── GÉNÉRATION MOT DE PASSE ── */
    function generatePassword() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        let pwd = '';
        for (let i = 0; i < 16; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
        const inp = document.getElementById('f-pwd');
        inp.value = pwd;
        inp.type  = 'text';
        document.getElementById('eye-icon').className = 'fa-solid fa-eye-slash';
        /*
         * TODO Python : envoyer pwd à ton API pour analyse de force
         * ex : fetch('/api/check-strength', { method:'POST', body: JSON.stringify({pwd}) })
         *      .then(r => r.json()).then(d => setStrength(d.strength))
         */
        setStrength('');
        showToast('Mot de passe généré');
    }

    function togglePwdVisibility() {
        const inp  = document.getElementById('f-pwd');
        const icon = document.getElementById('eye-icon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            inp.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    }

    /* ── MODAL ── */
    function openModal(isEdit = false) {
        if (!isEdit) {
            editId = null;
            document.getElementById('modal-title').textContent = 'Nouveau mot de passe';
            document.getElementById('f-site').value = '';
            document.getElementById('f-user').value = '';
            document.getElementById('f-pwd').value  = '';
            document.getElementById('f-pwd').type   = 'password';
            document.getElementById('eye-icon').className = 'fa-solid fa-eye';
            setStrength('');
        }
        document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
    }

    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    /* ── FILTRES ── */
    function setTab(el, strength) {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        currentStrength = strength;
        renderList();
    }

    function handleSearch(val) {
        searchQuery = val;
        renderList();
    }

    /* ── TOAST ── */
    let toastTimeout;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    renderList();
</script>

</body>
</html>
